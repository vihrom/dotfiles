#!/usr/sbin/nft -f

# Recreate only our own table, keeping other tables intact.
add table inet filter
flush table inet filter

table inet filter {

    chain input {
        type filter hook input priority filter; policy drop;

        # Loopback: local services, sing-box redirected TCP
        iif "lo" accept

        # Drop malformed packets early
        ct state invalid drop

        # Replies to our connections and related traffic
        ct state established,related accept

        # Traffic from the Throne TUN interface
        iifname "throne-tun" accept

        # IPv4 ICMP: echo for diagnostics, errors needed for PMTU discovery
        icmp type { echo-request, destination-unreachable, time-exceeded, parameter-problem } limit rate 10/second accept

        # IPv6 is not used on this machine. If you get IPv6, add:
        # icmpv6 type { echo-request, destination-unreachable, packet-too-big, time-exceeded, parameter-problem } limit rate 10/second accept
        # icmpv6 type { nd-router-advert, nd-neighbor-solicit, nd-neighbor-advert, mld-listener-query } accept

        # SSH from the local network: uncomment only if you need incoming SSH
        # tcp dport 22 ct state new limit rate 3/minute accept
    }

    chain forward {
        # This desktop does not route traffic for other hosts
        type filter hook forward priority filter; policy drop;
    }

    chain output {
        # Outgoing traffic is allowed by default
        type filter hook output priority filter; policy accept;
    }
}
